<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BFFF"/>
      <stop offset="100%" stop-color="#00D9A6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Hexagon -->
  <polygon points="50,5 90,27 90,73 50,95 10,73 10,27" fill="none" stroke="url(#primaryGrad)" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Circuit Nodes -->
  <circle cx="50" cy="5" r="3" fill="#00BFFF"/>
  <circle cx="90" cy="27" r="3" fill="#00D9A6"/>
  <circle cx="90" cy="73" r="3" fill="#00BFFF"/>
  <circle cx="50" cy="95" r="3" fill="#00D9A6"/>
  <circle cx="10" cy="73" r="3" fill="#00BFFF"/>
  <circle cx="10" cy="27" r="3" fill="#00D9A6"/>

  <!-- Traffic Light / Highway Stylized Icon -->
  <path d="M 35,32 L 65,32 L 72,70 L 28,70 Z" fill="#102238" stroke="#00BFFF" stroke-width="2"/>
  <line x1="50" y1="32" x2="50" y2="70" stroke="#00D9A6" stroke-width="2" stroke-dasharray="4,3"/>
  
  <!-- AI Radar Sweep Ring -->
  <circle cx="50" cy="50" r="16" fill="none" stroke="#00BFFF" stroke-width="1.5" opacity="0.6"/>
  <circle cx="50" cy="50" r="6" fill="#00D9A6" filter="url(#glow)"/>
</svg>
