services:
  smart-traffic-monitoring:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_traffic_monitoring_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - DEBUG=False
      - SECRET_KEY=smart-traffic-docker-security-key-2026
      - MODEL_PATH=models/yolov8.onnx
      - CONFIDENCE_THRESHOLD=0.35
      - IOU_THRESHOLD=0.45
      - DEFAULT_ROAD_CAPACITY=15
      - FRAME_SKIP=1
    volumes:
      # Persistent host mounts for data retention
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./backend/database:/app/backend/database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
